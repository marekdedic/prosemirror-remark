---
name: "CI"
"on":
  push:
    branches: "*"
  pull_request:
env:
  cache-version: 1

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6.1.0
        with:
          path: "~/.npm"
          key: >-
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{
            hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Build"
        run: |
          npm run build

      - name: "Check the built output"
        run: |
          npm run check

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6.1.0
        with:
          path: "~/.npm"
          key: >-
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{
            hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Lint"
        run: |
          npm run lint

  test:
    name: "Test"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7.0.1

      - name: "Setup Node"
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: "Cache NPM dependencies"
        uses: actions/cache@v6.1.0
        with:
          path: "~/.npm"
          key: >-
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{
            hashFiles('package.json') }}
          restore-keys: |
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-${{ hashFiles('package.json') }}
            npm-dependencies-${{ runner.os }}-${{ env.cache-version }}-

      - name: "Install NPM dependencies"
        run: |
          npm ci

      - name: "Run tests"
        run: |
          npm test

      - name: "Upload coverage results"
        if: matrix.node-version == 26
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
